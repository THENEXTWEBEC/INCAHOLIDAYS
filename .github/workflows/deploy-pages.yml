name: Deploy Inca Holidays to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: node src/build.mjs

      - name: Copy standalone itinerary pages
        run: |
          mkdir -p dist/destinations/galapagos/itineraries dist/en/destinations/galapagos/itineraries
          cp destinations/galapagos/itineraries/index.html dist/destinations/galapagos/itineraries/index.html
          cp en/destinations/galapagos/itineraries/index.html dist/en/destinations/galapagos/itineraries/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

